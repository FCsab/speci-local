[workspace]
members = ["android"] # the root package is a member too
# `cargo build` / `cargo test` at the top level only build the desktop app
default-members = ["."]

# the one version number for every platform (the release workflow reads it from here)
[workspace.package]
version = "1.0.0"
edition = "2024"

# the GUI libraries, each version in one place: raise these three together when upgrading
# egui (eframe and egui_kittest share a version; winit must be the one eframe uses)
[workspace.dependencies]
eframe = { version = "0.37.0", default-features = false }
egui_kittest = "0.37"
winit = { version = "0.30", default-features = false }

[package]
name = "speci-local"
version.workspace = true
edition.workspace = true

[dependencies]
# every system picks its renderer (and Android can't have the `accesskit` feature) below
eframe = { workspace = true, features = [
    "clipboard",
    "links",
    "persistence",
] }
miniz_oxide = "0.8"
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# without `encoding`: test data is always UTF-8 here
yaml-rust2 = { version = "0.13.0", default-features = false }

# Windows, Linux, macOS: native file dialogs and clipboard
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"
rfd = "0.17.2"

# Linux: the OpenGL renderer, which is about 9 MB smaller in the executable than wgpu and
# needs less memory. winit's own defaults bring the window frame for GNOME on Wayland.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = [
    "accesskit",
    "glow",
    "system_fonts",
    "wayland",
    "x11",
] }
winit = { workspace = true, features = ["default"] }

# Windows, macOS: eframe's default features (the wgpu renderer) but for its default fonts:
# the app has its own, and other scripts and emoji come from the system's fonts
[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
eframe = { workspace = true, features = [
    "accesskit",
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
winit = { workspace = true, features = ["default"] }

# Android: wgpu, and the system clipboard through JNI
[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
jni = "0.22"
ndk-context = "0.1"
winit = { workspace = true, features = ["android-native-activity"] }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }

[profile.release]
strip = true
# slower to build (minutes), about 5 MB smaller
lto = "fat"
codegen-units = 1

# the libraries are optimized for size; the app's own code (the evaluator) stays at full speed
[profile.release.package."*"]
opt-level = "s"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
