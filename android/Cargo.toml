# The Android app: a thin shim around the `speci-local` library.
# Build the APK with `cargo apk build -p speci-local-android --release` (see README).
[package]
name = "speci-local-android"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
speci-local = { path = ".." }
eframe = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"

# ---- APK settings for cargo-apk (https://github.com/rust-mobile/cargo-apk)

[package.metadata.android]
package = "io.github.fcsab.specilocal"
apk_name = "speci-local"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
resources = "res"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
# 35+ forces edge-to-edge drawing, which NativeActivity apps can't adapt to
target_sdk_version = 34

[package.metadata.android.application]
label = "speci-local"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
# handle rotation, resizing and keyboards in-app instead of restarting the activity
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density"
launch_mode = "singleTask"
