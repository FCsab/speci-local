name: Release

# Push a tag like `v0.2.0` to build the binaries and publish a GitHub release.
# "Run workflow" (manual) builds the same archives as downloadable artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported Ubuntu → the binary runs on older glibc versions too
          - os: ubuntu-22.04
            archive: speci-local-linux-x86_64.tar.gz
          - os: windows-latest
            archive: speci-local-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.archive }} -C target/release speci-local -C ../.. README.md
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/speci-local.exe, README.md -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
